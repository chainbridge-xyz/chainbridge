stroke-width="2"/><rect x="710.0" y="410.0" width="300.0" height="60.0" rx="15.0" fill="#F2E7D3" stroke="#8A5A0F" stroke-width="2"/><polyline points="372.0,440.0 418.0,440.0" fill="none" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="418.0" y1="440.0" x2="406.3" y2="434.3" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><line x1="418.0" y1="440.0" x2="406.3" y2="445.7" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><polyline points="662.0,440.0 708.0,440.0" fill="none" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="708.0" y1="440.0" x2="696.3" y2="434.3" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><line x1="708.0" y1="440.0" x2="696.3" y2="445.7" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><text x="60.0" y="40.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="23.0">Agent identity</tspan></text><text x="60.0" y="80.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="12.3">ChainBridgeIdentityRegistry — minimal, ERC-8004-shaped, live on Base Sepolia.</tspan></text><text x="180.0" y="180.6" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" xml:space="preserve"><tspan x="180.0" dy="12.3">controller address</tspan></text><text x="180.0" y="270.6" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" xml:space="preserve"><tspan x="180.0" dy="12.3">per-controller nonce</tspan></text><text x="520.0" y="220.0" fill="#0A5F63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" text-anchor="middle" xml:space="preserve"><tspan x="520.0" dy="9.8">keccak256(</tspan><tspan x="520.0" dy="15.0">  abi.encode(controller, nonce))</tspan></text><text x="890.0" y="217.5" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="890.0" dy="11.5">agentId</tspan><tspan x="890.0" dy="17.5">known before the tx confirms</tspan></text><text x="78.0" y="364.0" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" xml:space="preserve"><tspan x="78.0" dy="11.5">On-chain  ·  0xD4aeb0a8846C9F80ecb396aFD6dd532f2a21B3f2</tspan></text><text x="230.0" y="433.1" fill="#8A5A0F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" text-anchor="middle" xml:space="preserve"><tspan x="230.0" dy="9.0">register(name, caps, endpoint)</tspan></text><text x="540.0" y="431.2" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="540.0" dy="11.5">AgentInfo stored</tspan></text><text x="860.0" y="433.1" fill="#8A5A0F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="9.0">resolve(agentId) -&gt; AgentInfo</tspan></text><text x="90.0" y="500.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan x="90.0" dy="10.7">register  253,385 gas        deploy  938,775 gas        9 tests incl. fuzz, source verified</tspan></text><text x="60.0" y="640.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="10.7">Why a per-controller nonce, and not the obvious alternatives:</tspan><tspan x="60.0" dy="16.2"></tspan><tspan x="60.0" dy="16.2">·  keccak(controller, timestamp) — the spike's version — collides for two agents in one block.</tspan><tspan x="60.0" dy="16.2">·  A global sequential uint256 leaks total supply and blocks one controller holding many agents.</tspan><tspan x="60.0" dy="16.2">·  The nonce is readable, so the id is counterfactual: the SDK returns it before the tx lands,</tspan><tspan x="60.0" dy="16.2">   exactly as wallet addresses already behave.</tspan></text></svg>