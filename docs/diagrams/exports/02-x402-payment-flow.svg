ca, Arial, sans-serif" font-size="16" text-anchor="middle" xml:space="preserve"><tspan x="210.0" dy="13.1">Agent</tspan></text><text x="570.0" y="146.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" xml:space="preserve"><tspan x="570.0" dy="13.1">Seller API</tspan></text><text x="930.0" y="146.0" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" xml:space="preserve"><tspan x="930.0" dy="13.1">USDC on Base</tspan></text><rect x="337.7" y="204.9" width="104.6" height="20.2" fill="#FFFFFF"/><text x="390.0" y="206.9" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="390.0" dy="10.7">GET /inference</tspan></text><rect x="324.2" y="274.9" width="131.7" height="20.2" fill="#FFFFFF"/><text x="390.0" y="276.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="390.0" dy="10.7">402 + requirements</tspan></text><rect x="327.5" y="419.9" width="124.9" height="20.2" fill="#FFFFFF"/><text x="390.0" y="421.9" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="390.0" dy="10.7">retry + X-PAYMENT</tspan></text><rect x="660.5" y="489.9" width="179.0" height="20.2" fill="#FFFFFF"/><text x="750.0" y="491.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="750.0" dy="10.7">transferWithAuthorization</tspan></text><rect x="721.3" y="559.9" width="57.3" height="20.2" fill="#FFFFFF"/><text x="750.0" y="561.9" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="750.0" dy="10.7">settled</tspan></text><rect x="330.9" y="629.9" width="118.2" height="20.2" fill="#FFFFFF"/><text x="390.0" y="631.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="390.0" dy="10.7">200 OK + receipt</tspan></text><text x="210.0" y="351.8" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="210.0" dy="10.7">sign EIP-3009 authorization</tspan><tspan x="210.0" dy="16.2">(EOA, offline)</tspan></text><text x="620.0" y="320.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="620.0" dy="9.8">Nothing is on-chain yet — the</tspan><tspan x="620.0" dy="15.0">402 body is just requirements.</tspan></text><text x="620.0" y="600.0" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="620.0" dy="9.8">83,208 gas per settlement.</tspan><tspan x="620.0" dy="15.0">Settled in the next block.</tspan></text><text x="570.0" y="746.2" fill="#9B2C2C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="570.0" dy="11.5">The signer must be an EOA. USDC verifies with ecrecover, so a smart account cannot sign EIP-3009.</tspan></text></svg>