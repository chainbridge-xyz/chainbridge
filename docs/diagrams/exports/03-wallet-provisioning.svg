d"/><line x1="318.0" y1="603.0" x2="306.3" y2="608.7" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><polyline points="522.0,603.0 578.0,603.0" fill="none" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="578.0" y1="603.0" x2="566.3" y2="597.3" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><line x1="578.0" y1="603.0" x2="566.3" y2="608.7" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><polyline points="782.0,603.0 838.0,603.0" fill="none" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="838.0" y1="603.0" x2="826.3" y2="597.3" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><line x1="838.0" y1="603.0" x2="826.3" y2="608.7" stroke="#8A5A0F" stroke-width="2" stroke-linecap="round"/><text x="60.0" y="40.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="23.0">Smart account provisioning</tspan></text><text x="60.0" y="80.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="12.3">How @chainbridge/wallet turns an EOA into a deployed Safe. First UserOp deploys it.</tspan></text><text x="160.0" y="170.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" xml:space="preserve"><tspan x="160.0" dy="13.1">Owner EOA</tspan></text><text x="450.0" y="163.8" fill="#0A5F63" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="450.0" dy="10.7">computeSafeAddress()</tspan><tspan x="450.0" dy="16.2">pure CREATE2 — no RPC</tspan></text><text x="790.0" y="163.8" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="790.0" dy="10.7">address known</tspan><tspan x="790.0" dy="16.2">before anything exists on-chain</tspan></text><text x="640.0" y="232.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="640.0" dy="9.8">Show it. Fund it. Store it.</tspan></text><text x="76.0" y="312.0" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="76.0" dy="12.3">provision()  ·  order matters</tspan></text><text x="185.0" y="381.8" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="185.0" dy="10.7">estimate</tspan><tspan x="185.0" dy="16.2">fees + nonce</tspan></text><text x="395.0" y="381.8" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="395.0" dy="10.7">ask paymaster</tspan><tspan x="395.0" dy="16.2">to sponsor</tspan></text><text x="605.0" y="381.8" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="605.0" dy="10.7">estimate gas</tspan><tspan x="605.0" dy="16.2">limits</tspan></text><text x="815.0" y="381.8" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="815.0" dy="10.7">sign SafeOp</tspan><tspan x="815.0" dy="16.2">EIP-712</tspan></text><text x="500.0" y="467.9" fill="#9B2C2C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="500.0" dy="10.7">Sponsor BEFORE signing — paymaster fields are inside the signed digest.</tspan></text><text x="160.0" y="593.6" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" xml:space="preserve"><tspan x="160.0" dy="12.3">Bundler</tspan></text><text x="420.0" y="594.2" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="420.0" dy="11.5">EntryPoint v0.7</tspan></text><text x="680.0" y="594.9" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="680.0" dy="10.7">SafeProxyFactory</tspan></text><text x="940.0" y="594.2" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="940.0" dy="11.5">Safe deployed</tspan></text><text x="60.0" y="670.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="10.7">Measured on Base Sepolia:  409,504 gas to deploy, included 3.6s after submission,</tspan><tspan x="60.0" dy="16.2">fully paymaster-sponsored — the owner EOA paid zero. A later no-op UserOp cost 146,991.</tspan></text></svg>