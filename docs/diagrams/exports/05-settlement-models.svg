<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="840" viewBox="32.0 12.0 1016.0 840.0" role="img" aria-label="05-settlement-models"><rect x="60.0" y="130.0" width="440.0" height="420.0" rx="32.0" fill="none" stroke="#5D7071" stroke-width="1" stroke-dasharray="8 6"/><rect x="90.0" y="210.0" width="380.0" height="54.0" rx="13.5" fill="#EDF1F0" stroke="#5D7071" stroke-width="2"/><rect x="90.0" y="300.0" width="380.0" height="54.0" rx="13.5" fill="#EDF1F0" stroke="#5D7071" stroke-width="2"/><rect x="90.0" y="390.0" width="380.0" height="54.0" rx="13.5" fill="none" stroke="#5D7071" stroke-width="2"/><polyline points="280.0,266.0 280.0,296.0" fill="none" stroke="#5D7071" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.0" y1="296.0" x2="285.7" y2="284.3" stroke="#5D7071" stroke-width="2" stroke-linecap="round"/><line x1="280.0" y1="296.0" x2="274.3" y2="284.3" stroke="#5D7071" stroke-width="2" stroke-linecap="round"/><polyline points="280.0,356.0 280.0,386.0" fill="none" stroke="#5D7071" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.0" y1="386.0" x2="285.7" y2="374.3" stroke="#5D7071" stroke-width="2" stroke-linecap="round"/><line x1="280.0" y1="386.0" x2="274.3" y2="374.3" stroke="#5D7071" stroke-width="2" stroke-linecap="round"/><rect x="560.0" y="130.0" width="460.0" height="420.0" rx="32.0" fill="none" stroke="#0A5F63" stroke-width="1" stroke-dasharray="8 6"/><rect x="590.0" y="210.0" width="400.0" height="54.0" rx="13.5" fill="#DDEAE9" stroke="#0A5F63" stroke-width="2"/><rect x="590.0" y="300.0" width="400.0" height="54.0" rx="13.5" fill="#DDEAE9" stroke="#0A5F63" stroke-width="2"/><rect x="590.0" y="390.0" width="400.0" height="54.0" rx="13.5" fill="#DDEAE9" stroke="#0A5F63" stroke-width="2"/><polyline points="790.0,266.0 790.0,296.0" fill="none" stroke="#0A5F63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="790.0" y1="296.0" x2="795.7" y2="284.3" stroke="#0A5F63" stroke-width="2" stroke-linecap="round"/><line x1="790.0" y1="296.0" x2="784.3" y2="284.3" stroke="#0A5F63" stroke-width="2" stroke-linecap="round"/><polyline points="790.0,356.0 790.0,386.0" fill="none" stroke="#0A5F63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="790.0" y1="386.0" x2="795.7" y2="374.3" stroke="#0A5F63" stroke-width="2" stroke-linecap="round"/><line x1="790.0" y1="386.0" x2="784.3" y2="374.3" stroke="#0A5F63" stroke-width="2" stroke-linecap="round"/><rect x="60.0" y="590.0" width="960.0" height="150.0" rx="32.0" fill="none" stroke="#8A5A0F" stroke-width="1" stroke-dasharray="8 6"/><rect x="60.0" y="780.0" width="960.0" height="44.0" rx="11.0" fill="#F6DEDE" stroke="#9B2C2C" stroke-width="2"/><text x="60.0" y="40.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="23.0">Settlement models</tspan></text><text x="60.0" y="80.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="60.0" dy="12.3">ADR-004. Facilitator is the default; self-host is the enterprise opt-out.</tspan></text><text x="78.0" y="144.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" xml:space="preserve"><tspan x="78.0" dy="13.1">Option A — self-host, synchronous</tspan></text><text x="78.0" y="172.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="78.0" dy="9.8">ships today  ·  opt-out for enterprise</tspan></text><text x="280.0" y="228.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="10.7">Seller receives X-PAYMENT</tspan></text><text x="280.0" y="318.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="10.7">Seller submits to USDC itself</tspan></text><text x="280.0" y="408.9" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="280.0" dy="10.7">Seller pays the gas, waits for the block</tspan></text><text x="90.0" y="466.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="90.0" dy="9.8">Simple. No third party.</tspan><tspan x="90.0" dy="15.0">Every payment pays full gas.</tspan></text><text x="578.0" y="144.0" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" xml:space="preserve"><tspan x="578.0" dy="13.1">Option C — ChainBridge facilitator</tspan></text><text x="578.0" y="172.0" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="578.0" dy="9.8">the default</tspan></text><text x="790.0" y="228.9" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="790.0" dy="10.7">Seller forwards the authorization</tspan></text><text x="790.0" y="318.9" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="790.0" dy="10.7">ChainBridge batches N payments</tspan></text><text x="790.0" y="408.9" fill="#0A5F63" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="790.0" dy="10.7">One settlement tx, gas split N ways</tspan></text><text x="590.0" y="466.0" fill="#5D7071" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" xml:space="preserve"><tspan x="590.0" dy="9.8">Batching is where the margin lives.</tspan><tspan x="590.0" dy="15.0">0.3% take rate stays viable.</tspan></text><text x="78.0" y="604.0" fill="#8A5A0F" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" xml:space="preserve"><tspan x="78.0" dy="12.3">Measured economics — Base Sepolia</tspan></text><text x="82.0" y="638.0" fill="#0D1517" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan x="82.0" dy="10.7">83,208 gas per settlement  ≈  $0.001 at current Base gas.</tspan><tspan x="82.0" dy="16.2">Unbatched:  $1 payment  -&gt;  $0.003 fee  -&gt;  ~$0.002 net.</tspan><tspan x="82.0" dy="16.2">Batched x10:  gas drops ~10x  -&gt;  ~$0.0029 net per payment.</tspan></text><text x="540.0" y="793.9" fill="#9B2C2C" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="540.0" dy="10.7">Option B (on-chain escrow per payment) rejected — gas cost destroys the unit economics.</tspan></text></svg>